{{META_COMMENT}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
{{FM_CSS}}
  </style>
  <style>
    /* Document setting. The FM sheet above owns every component style; this block sets the
       document: one measure and one 1.25 scale off 16px, and no card, because the ask and the
       answer open the page and nothing has to be lifted off it to find them. Section
       registers follow the readability findings of 2026-09-13.

       Size encodes role, not section, so a new section reads its size off this list and not
       off the section beside it. --doc-body (16px) is running prose at the measure: section
       paragraphs and the open-questions list. A caption block's own title steps back up to
       body, which is why the pick lead is body above caption-sized reasons. --doc-caption
       (13px) is anything in a column or a note: the ticket line under the ask, the background
       columns, What ships, the approach lines, the comparison table, the pick reasons and its
       cost, the blocker, the change columns, the sources, the latitude line, the footer.
       --doc-micro (11px) is uppercase tracked labels, plus the three marks that sit at label
       scale without being words: the part numeral in the bar, the criterion source under
       a comparison row heading, and the phrases annotating a drawing.

       The h3 elements are the background and change column labels, which are labels, which is
       why they are micro. --doc-h2 carries the answer and every part heading alike:
       those are the document's load-bearing statements and neither outranks the other.

       One size is drawn rather than set. .bb__name, the place name inside a breadboard box,
       is 15px: it is an SVG text node that has to read louder than the affordances under it
       and quieter than a heading, and no step on this scale lands there. The test names that
       one exception by value, so it cannot spread. */
    :root {
      --doc-measure: 620px;  /* 73 characters at --doc-body: where Linear's changelog (622px) and Shape Up (795px at 21.9px) both land */
      --doc-wide: 1200px;    /* the widest a drawing row or a table may reach, on the same left edge as the text */
      --doc-body: 17px;      /* every running sentence in the document */
      --doc-lead: 20px;      /* the pick statement: the one line in a block that has to outrank its own reasons */
      --doc-caption: 15px;   /* genuinely secondary text: comparison cells, drawing notes, the context line */
      --doc-label: 13px;     /* a section's own name: uppercase and tracked, because it labels the section rather than stating anything */
      --doc-micro: 12px;     /* uppercase tracked micro-labels only: uppercase reads optically larger, so a step below label is correct here, not drift */
      --doc-h2: 30px;
      --doc-h1: 40px;
    }
    body { background: var(--fm-base-white); color: var(--fm-text-primary); padding: 56px 40px 112px; font-size: var(--doc-body); line-height: 1.65; }
    .doc { max-width: var(--doc-wide); margin: 0 auto; }

    .doc__head { margin: 0 0 8px; }
    .doc__title { font-size: var(--doc-h1); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; max-width: 22ch; }
    .doc__context { font-size: var(--doc-caption); color: var(--fm-text-tertiary); margin: 0; letter-spacing: 0.02em; }

    /* A section is a rule and space. Nothing is lifted: the ask opens the document, so no
       card has to tell a reader where to start.

       Rank is the whole of the section rhythm. A section's name ("The ask", "How it
       connects", "Sources") is a LABEL: it says which drawer you are in and states
       nothing. A part's name and the answer are STATEMENTS, and they are what
       a reader came for. Those two were set identically at h2 until 2026-09-14, so a
       document with three decisions had ten things shouting at the same volume and no way
       to tell a heading from a claim. Labels now sit on --doc-label, uppercase and tracked,
       and the only elements left at h2 are the answer and one heading per part.

       Space says the same thing twice: the gap down to the next section's rule is more than
       twice the gap from a rule to the heading under it, so a boundary is never ambiguous. */
    .doc__section { border-top: 1px solid var(--fm-base-400); padding: 24px 0 0; margin: 0 0 64px; }

    /* The parts bar. The map at the top of the document scrolled away after the first
       screen and never came back, and what it was mapping is nine thousand pixels long, so
       from there on a reader had no way to see the shape of what they were in or to move
       inside it. This is that map, condensed to one line and pinned. It carries each part's
       name, the words that head the part's own block, so a reader looking for a place finds it;
       the full name rides in the title attribute, since the line truncates. */
    .doc__jump { position: sticky; top: 0; z-index: 2; display: flex; gap: 24px; align-items: stretch; background: var(--fm-base-white); border-bottom: 1px solid var(--fm-base-300); padding: 12px 0; margin: 0 0 56px; }
    .doc__jump-item { flex: 1 1 0; min-width: 0; display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fm-text-tertiary); font-size: var(--doc-caption); line-height: 1.4; }
    .doc__jump-num { flex: none; width: 20px; height: 20px; border-radius: 4px; background: var(--fm-base-200); color: var(--fm-text-primary); display: inline-flex; align-items: center; justify-content: center; font-size: var(--doc-micro); font-weight: 700; }
    .doc__jump-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc__jump-item:hover .doc__jump-text, .doc__jump-item:focus .doc__jump-text { color: var(--fm-text-primary); }
    .doc__section > h2 { font-size: var(--doc-label); font-weight: 700; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fm-text-primary); margin: 0 0 18px; max-width: var(--doc-measure); }
    .doc__section > p, .doc__section > ul { max-width: var(--doc-measure); }
    .doc__section p { margin: 0 0 12px; }

    /* Apparatus: what the document says about itself reads as a note, never as prose. */
    .doc__muted { font-size: var(--doc-body); line-height: 1.55; color: var(--fm-text-tertiary); border-left: 2px solid var(--fm-base-300); padding-left: 12px; margin: 14px 0 0; }
    .doc__list { margin: 0; padding-left: 20px; }
    .doc__list li { margin: 0 0 10px; }
    .doc__source { color: var(--fm-text-tertiary); font-size: var(--doc-caption); }

    .approaches { display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start; }
    /* A drawing column keeps the width it was drawn at and never exceeds the space it sits in:
       past that it scrolls inside its own box, at every screen width, since a drawing reaches
       1200 and a side panel or a laptop is narrower than that. Paper is the print block. A scroll box clips what is drawn outside
       it, and the frame's ring is drawn 8px outside the frame, so the column carries 8px of
       padding for the ring and takes the same 8px back in margin: it sits where it did. The
       padding sits outside the drawn width (content-box), or the frame would overflow the
       column by 16px and every drawing would scroll. */
    .proposal-screen__col { display: flex; flex-direction: column; flex: none; box-sizing: content-box; max-width: 100%; overflow-x: auto; padding: 8px; margin: -8px; }
    /* The app and surface a drawing lives on, over it: on the chosen drawing always, on an
       option not chosen only when it is not the proposal's surface. */
    .proposal-screen__label { display: flex; flex-direction: column; gap: 4px; max-width: 100%; font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fm-text-secondary); margin-bottom: 10px; overflow-wrap: anywhere; }
    .proposal-screen__label--lead { margin-bottom: 8px; }
    .proposal-screen__anchor { font-weight: 400; color: var(--fm-text-tertiary); }
    /* The ring is drawn 8px outside the frame, so the frame keeps 8px below it: text set right
       under a drawing used to sit on its ring. */
    .proposal-screen { background: var(--fm-base-white); border: 1px solid var(--fm-base-400); border-radius: 6px; overflow: visible; box-shadow: 0 0 0 8px var(--fm-base-100); margin: 0 0 8px; }
    .proposal-screen .fm-app-header { width: 100%; }
    .proposal-screen__body { position: relative; padding: 16px; }
    .proposal-screen__body .fm-page-header { padding: 0 0 12px; }
    /* An option not chosen: its name over the drawing and one line under it, the verdict in bold
       and then where it breaks. Body size, because that line is what a reader takes from the
       option; everything else it once carried is in the comparison below. */
    /* Every line of text in a drawing column breaks inside a long word (these two, the label,
       the notes, Built from and Adds), since one unbroken word wider than the drawing would
       scroll the whole column, drawing included. Not on the column itself: it would reach the
       product copy inside the drawing. */
    .option__name { font-size: var(--doc-body); font-weight: 700; line-height: 1.4; margin: 0 0 12px; max-width: 100%; overflow-wrap: anywhere; }
    .option__why { font-size: var(--doc-body); line-height: 1.55; color: var(--fm-text-secondary); margin: 8px 0 0; max-width: 100%; overflow-wrap: anywhere; }
    .option__why b { color: var(--fm-text-primary); }

    .compare { width: 100%; border-collapse: collapse; font-size: var(--doc-caption); }
    .compare th, .compare td { text-align: left; vertical-align: top; padding: 10px 12px 10px 0; border-top: 1px solid var(--fm-base-300); }
    .compare tbody th { font-weight: 600; padding-right: 24px; }
    .compare thead th { border-top: 0; color: var(--fm-text-tertiary); font-size: var(--doc-micro); text-transform: uppercase; letter-spacing: 0.05em; }
    .compare__source { display: block; font-size: var(--doc-micro); color: var(--fm-text-tertiary); font-weight: 400; margin-top: 2px; }
    /* The picked column, marked where the evidence is read rather than only in the
       paragraph below it. Tint plus a word, so it holds in greyscale and in print. */
    .compare__pick { background: var(--fm-base-100); }
    .compare th.compare__pick, .compare td.compare__pick { padding-left: 12px; }
    .compare thead th.compare__pick { border-top: 2px solid var(--fm-base-800); color: var(--fm-text-primary); }
    .compare__picked { display: block; font-size: var(--doc-micro); font-weight: 700; letter-spacing: 0.06em; color: var(--fm-brand-dark); margin-top: 2px; }
    /* A verdict carries a glyph as well as a colour: WCAG 1.4.1, and the table stays readable
       in greyscale and in print. CSS escapes, not literal glyphs, so the file is safe whatever
       charset a reader's tooling assumes.

       The glyph sits on its own line above the phrase, so the table has a row of marks that
       can be scanned in one pass and the words are there for whoever wants them. Fifteen
       written phrases laid out as prose is a table that has to be READ, which is the one
       thing a comparison table exists not to be. */
    .compare__mark { display: block; font-weight: 700; font-size: var(--doc-body); line-height: 1.2; }
    .compare__text { display: block; font-size: var(--doc-micro); line-height: 1.45; color: var(--fm-text-tertiary); margin-top: 2px; }
    .tone-good .compare__mark { color: var(--fm-text-success); }
    .tone-good .compare__mark::before { content: "\2713"; }
    .tone-mixed .compare__mark { color: var(--fm-text-secondary); }
    .tone-mixed .compare__mark::before { content: "\25CB"; }
    .tone-bad .compare__mark { color: var(--fm-text-error); }
    .tone-bad .compare__mark::before { content: "\2717"; }

    .oq__kind { display: block; font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin-bottom: 2px; }

    .doc__footer { font-size: var(--doc-caption); color: var(--fm-text-tertiary); margin: 32px 0 0; padding-top: 20px; border-top: 1px solid var(--fm-base-300); max-width: var(--doc-measure); }

    /* The ask. What was asked, before what we propose: running text at the measure, quieter
       than the answer under it, with the ticket's own id and title as a note. */
    .ask { font-size: var(--doc-body); line-height: 1.6; margin: 0; max-width: var(--doc-measure); }
    .ask__ticket { font-size: var(--doc-caption); line-height: 1.5; color: var(--fm-text-tertiary); margin: 10px 0 0; max-width: var(--doc-measure); }

    /* The answer. One sentence at h2 scale under the ask, tied with a part heading rather
       than with the title above it, and nothing follows it inside its own section: "What
       ships" is the summary and this is the statement. */
    .answer { font-size: var(--doc-h2); font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; margin: 0; max-width: var(--doc-measure); }

    /* The terrain. The SVG carries no colour of its own; every value it draws with is here. */
    .bb { width: 100%; overflow-x: auto; margin: 0 0 14px; }
    .bb__svg { display: block; max-width: 100%; height: auto; }
    .bb__box { stroke: var(--fm-base-400); stroke-width: 1; }
    .bb__box--new { stroke: var(--fm-brand); stroke-width: 2; stroke-dasharray: 6 4; }
    .bb__app { font-size: var(--doc-micro); font-weight: 700; letter-spacing: 0.08em; fill: var(--fm-text-tertiary); }
    .bb__name { font-size: 18px; font-weight: 700; fill: var(--fm-text-primary); }
    .bb__rule { stroke: var(--fm-base-300); stroke-width: 1; }
    .bb__aff { font-size: var(--doc-caption); fill: var(--fm-text-secondary); }
    .bb__line { stroke: var(--fm-base-600); stroke-width: 2; }
    .bb__line--new { stroke: var(--fm-brand); stroke-dasharray: 6 4; }
    .bb__label { font-size: var(--doc-micro); font-weight: 700; letter-spacing: 0.06em; fill: var(--fm-text-tertiary); }
    .bb__head path { fill: var(--fm-base-600); }
    .bb__head--new path { fill: var(--fm-brand); }
    .bb__legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 0; font-size: var(--doc-micro); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); font-weight: 700; }
    .bb__legend span { display: inline-flex; align-items: center; gap: 6px; }
    .bb__swatch { width: 22px; border-top: 2px solid var(--fm-base-600); }
    .bb__swatch--new { border-top: 2px dashed var(--fm-brand); }

    /* What ships: each part, what it builds and what it costs, at a glance, before any of it
       is argued. */
    .decisions-at-a-glance { width: 100%; border-collapse: collapse; font-size: var(--doc-caption); }
    .decisions-at-a-glance th, .decisions-at-a-glance td { text-align: left; vertical-align: top; padding: 10px 24px 10px 0; border-top: 1px solid var(--fm-base-300); }
    .decisions-at-a-glance thead th { border-top: 0; color: var(--fm-text-tertiary); font-size: var(--doc-micro); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .decisions-at-a-glance tbody th { font-weight: 600; color: var(--fm-text-primary); }
    .decisions-at-a-glance td { color: var(--fm-text-secondary); }

    /* The background: short columns, never running prose. Goals and Not doing are the scope;
       how it works today is the evidence, and the research has a section of its own. Four
       columns across 1200px once made each one 260px of ragged 13px text and put a goal beside
       a research finding as though they answered the same question. Two columns, each capped
       at the measure, wrap on a wide canvas and stack to one on a narrow one. */
    /* The research. Three lanes stacked rather than columned: a reader reads down them in
       order (what the market does, what the canon says, what we already own) rather than
       holding them against each other, which is what the briefing's two columns are for. */
    .research { display: flex; flex-direction: column; gap: 28px; }
    .research__lane h3 { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 10px; }
    .research__lane .doc__list { max-width: var(--doc-measure); }
    .research__lane .doc__list li { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); }
    .briefing { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 520px)); gap: 32px 48px; }
    .briefing__col h3 { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 10px; }
    .briefing__col .doc__list li { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); }

    /* A part block, headed by the part's name, so a reader knows what it builds before
       reading why. The rule is heavier and darker
       than a framing section's, because these blocks are the argument and the sections
       around them are the setting. */
    .decision { border-top: 3px solid var(--fm-base-800); padding: 24px 0 0; margin: 0 0 80px; scroll-margin-top: 64px; }
    .decision > h2 { font-size: var(--doc-h2); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 18px; max-width: var(--doc-measure); }
    .decision__blocker { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); border-left: 2px solid var(--fm-brand); background: var(--fm-brand-light); padding: 10px 12px; margin: 18px 0 0; max-width: var(--doc-measure); }
    .decision__blocker b { color: var(--fm-text-primary); }

    /* Annotations on a drawing: phrases, never sentences, and one quiet run rather than a
       stacked uppercase list. Uppercase is the least readable setting in the document and
       there were three lines of it under every drawing, above two more lines of prose and a
       tag: four treatments where one idea was being explained. */
    .option__notes { margin: 8px 0 0; font-size: var(--doc-micro); line-height: 1.5; color: var(--fm-text-tertiary); overflow-wrap: anywhere; }

    /* What the drawing is made of. Built from is quiet: composing the system is the ordinary
       case and does not need announcing. Adds is not quiet, because a proposal that needs a
       component the system does not have is proposing work nobody has costed, and a reader
       should meet that beside the drawing rather than in a build ticket weeks later. */
    .option__built { margin: 8px 0 0; font-size: var(--doc-micro); line-height: 1.5; color: var(--fm-text-tertiary); overflow-wrap: anywhere; }
    .option__adds { margin: 8px 0 0; font-size: var(--doc-micro); line-height: 1.5; color: var(--fm-text-secondary); border-left: 2px solid var(--fm-brand); background: var(--fm-brand-light); padding: 6px 8px; overflow-wrap: anywhere; }
    .option__adds-kind { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fm-brand-dark); }

    /* A part block is one two-column row: the case for the part on the document's left edge,
       the chosen drawing beside it, so a reader meets what we will build and why together.
       Both columns wrap to one on a narrow canvas. */
    .decision__lead { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; margin: 0 0 48px; }
    .decision__case { flex: 1 1 380px; min-width: 0; max-width: var(--doc-measure); }
    /* A drawing wider than 720, a page region, takes the row below its case rather than
       squeezing it, and the case keeps its measure above. */
    .decision__lead--stacked { flex-direction: column; }
    /* In a column the case's 380px basis would be a height, and a short case would leave a
       blank band above the drawing. */
    .decision__lead--stacked .decision__case { flex: none; }

    /* A fold: Other options and Research sit closed under their heading, one click open, because
       they argue for the design rather than being it. The summary counts what is inside. Print
       opens every fold first (the script at the end), since a saved PDF has nothing to click. */
    .doc__more > summary { cursor: pointer; width: fit-content; font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); padding: 4px 0; }
    .doc__more > summary:hover { color: var(--fm-text-primary); }
    .doc__more[open] > summary { margin: 0 0 32px; }

    /* Other options: what each part was chosen over, after the design. Each drawn at the
       proposal's width, wrapping rather than shrinking, with one line each, then the comparison,
       grouped under the part they lost to, so a reader who has read the design can skim these
       rather than weigh them again. */
    .other { margin: 0 0 56px; }
    .other > h3 { font-size: var(--doc-lead); font-weight: 700; line-height: 1.35; margin: 0 0 20px; }
    .other .approaches { margin: 0 0 32px; }
    .compare-block { margin: 0; }

    /* The case for a part: what it is, then why, one line per reason naming the row it argues
       from, then where it breaks and what it costs. */
    .pick { margin: 0; border-top: 0; padding: 0; max-width: var(--doc-measure); }
    .pick__lead { font-size: var(--doc-lead); font-weight: 700; line-height: 1.35; margin: 0 0 18px; }
    .pick__label { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 10px; }
    .pick__reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .pick__reasons li { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); }
    .pick__crit { font-weight: 700; color: var(--fm-text-primary); }
    .pick__cost { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); margin: 14px 0 0; }
    .pick__cost b { color: var(--fm-text-primary); }

    /* What this changes, and the latitude line that closes the document. */
    .change { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 520px)); gap: 32px 48px; }
    .change__col h3 { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 8px; }
    .change__col p { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-secondary); margin: 0; }
    .doc__latitude { font-size: var(--doc-body); line-height: 1.6; color: var(--fm-text-tertiary); margin: 0; max-width: var(--doc-measure); font-style: italic; }

    /* Where this came from. A two-column grid rather than a list, so the kinds stack into
       one narrow column and the eye reads down the texts beside them. The kind column is
       sized to its content and capped, so one long kind cannot push every citation right. */
    .citations { display: grid; grid-template-columns: minmax(0, max-content) 1fr; gap: 6px 20px; max-width: var(--doc-measure); }
    .citations__row { display: contents; }
    .citations__kind { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fm-text-tertiary); line-height: 1.7; white-space: nowrap; }
    .citations__text { font-size: var(--doc-body); line-height: 1.5; color: var(--fm-text-secondary); }

    [hidden] { display: none !important; }

    /* Narrow screens. The document is read on a phone once it is a link rather than a file,
       and everything here that is made of prose already reflows: the briefing and change
       grids are auto-fit, the citations grid is two columns of text, and the terrain SVG scales
       inside .bb. Three things do not.

       The drawings are the interesting case. A drawing is a mock of a real surface at a real
       width, and reflowing it at 400px would not be the same proposal shown smaller, it would
       be a different design, drawn by the browser, arguing for something nobody picked. So the
       column keeps the width it was drawn at and scrolls inside its own box, which is the
       one thing the page itself must never do; that rule sits on .proposal-screen__col, since
       it holds at every screen width. Same here for the comparison table, which is a table and reads
       as one or not at all.

       The terrain is the exception, and it was tried the other way first. .bb already scrolls,
       so letting .bb__svg past max-width: 100% should have shown it at full size; what it
       actually shows is blank, because the breadboard's viewBox carries about 400px of empty
       space to the left of its first box and that is precisely what a 360px scroll box lands
       on. So the terrain still scales down, small and complete, until the viewBox is cropped
       to its content. */
    @media (max-width: 640px) {
      body { padding: 16px 16px 64px; }
      .compare-block { max-width: 100%; overflow-x: auto; }
      .decision__lead, .approaches { gap: 32px; }
      .doc__jump { display: none; }
    }

    /* Paper has no scroll, and it is narrower than a drawing may be. A column that scrolls on
       screen printed cut at its edge over a scrollbar; let out, a wide drawing made the browser
       shrink every page and past about 1030px was still cut at the paper's edge. On paper the
       column takes its print width (the drawn width, or the assembler's PRINT_WIDTH when that is
       narrower) and the frame is zoomed to fit it: scaled like a screenshot, never reflowed, so
       the prose keeps its size. Last in the sheet, so it wins over the column's own rule. */
    @media print {
      .proposal-screen__col { width: var(--print-width) !important; max-width: none; overflow: visible; }
      .proposal-screen { zoom: var(--print-zoom); }
    }
  </style>
</head>
<body>
  <main class="doc">
    <header class="doc__head">
      <h1 class="doc__title">{{TITLE}}</h1>
      <p class="doc__context">{{CONTEXT}}</p>
    </header>
<!-- {{SECTIONS}} -->
  </main>
  <script>
    // One delegated listener: any element with data-toggle="<id>" toggles the hidden attribute of #<id>.
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-toggle]");
      if (!t) return;
      var el = document.getElementById(t.getAttribute("data-toggle"));
      if (el) el.hidden = !el.hidden;
    });
    // A fold prints closed, and a saved PDF has nothing to click, so print opens them all.
    window.addEventListener("beforeprint", function () {
      document.querySelectorAll("details").forEach(function (d) { d.open = true; });
    });
  </script>
</body>
</html>
