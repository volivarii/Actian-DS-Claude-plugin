{{META_COMMENT}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
{{FM_CSS}}
  </style>
  <style>
    /* Document setting. The FM sheet above owns every component style; this block sets the
       document: one measure and one 1.25 scale off 16px, and no card, because the answer is
       the first element and nothing has to be lifted off the page to find it. Section
       registers follow the readability findings of 2026-09-13.

       Size encodes role, not section, so a new section reads its size off this list and not
       off the section beside it. --doc-body (16px) is running prose at the measure: section
       paragraphs and the open-questions list. A caption block's own title steps back up to
       body, which is why the pick lead is body above caption-sized reasons. --doc-caption
       (13px) is anything in a column or a note: the answer picks, the briefing columns, the
       decision table, the approach lines, the comparison table, the pick reasons and its
       cost, the blocker, the change columns, the sources, the latitude line, the footer.
       --doc-micro (11px) is uppercase tracked labels, plus the three marks that sit at label
       scale without being words: the option numeral in its badge, the criterion source under
       a comparison row heading, and the phrases annotating a drawing.

       The h3 elements are the briefing and change column labels, which are labels, which is
       why they are micro. --doc-h2 carries the answer and every decision question alike:
       those are the document's load-bearing statements and neither outranks the other.

       One size is drawn rather than set. .bb__name, the place name inside a breadboard box,
       is 15px: it is an SVG text node that has to read louder than the affordances under it
       and quieter than a heading, and no step on this scale lands there. The test names that
       one exception by value, so it cannot spread. */
    :root {
      --doc-measure: 512px;   /* about 66 characters at 16px Inter; 45 to 75 is the readable band */
      --doc-body: 16px;
      --doc-caption: 13px;
      --doc-label: 13px;     /* a section's own name: caption scale, but uppercase and tracked, because it labels the section rather than stating anything */
      --doc-micro: 11px;     /* uppercase tracked micro-labels only: uppercase reads optically larger, so a step below caption is correct here, not drift */
      --doc-h2: 25px;
      --doc-h1: 31px;
    }
    body { background: var(--fm-base-200); color: var(--fm-text-primary); padding: 40px 40px 96px; font-size: var(--doc-body); line-height: 1.6; }
    .doc { max-width: 1200px; margin: 0 auto; }

    .doc__head { margin: 0 0 8px; }
    .doc__title { font-size: var(--doc-h1); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; max-width: 22ch; }
    .doc__context { font-size: var(--doc-caption); color: var(--fm-text-tertiary); margin: 0; letter-spacing: 0.02em; }

    /* A section is a rule and space. Nothing is lifted: the answer opens the document,
       so no card has to tell a reader where to start.

       Rank is the whole of the section rhythm. A section's name ("The terrain", "The
       briefing", "Where this came from") is a LABEL: it says which drawer you are in and
       states nothing. A decision's question and the answer are STATEMENTS, and they are what
       a reader came for. Those two were set identically at h2 until 2026-09-14, so a
       document with three decisions had ten things shouting at the same volume and no way
       to tell a heading from a claim. Labels now sit on --doc-label, uppercase and tracked,
       and the only elements left at h2 are the answer and one question per decision.

       Space says the same thing twice: the gap down to the next section's rule is more than
       twice the gap from a rule to the heading under it, so a boundary is never ambiguous. */
    .doc__section { border-top: 1px solid var(--fm-base-400); padding: 24px 0 0; margin: 0 0 56px; }
    .doc__section > h2 { font-size: var(--doc-label); font-weight: 700; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fm-text-primary); margin: 0 0 18px; max-width: var(--doc-measure); }
    .doc__section > p, .doc__section > ul { max-width: var(--doc-measure); }
    .doc__section p { margin: 0 0 12px; }

    /* Apparatus: what the document says about itself reads as a note, never as prose. */
    .doc__muted { font-size: var(--doc-caption); line-height: 1.5; color: var(--fm-text-tertiary); border-left: 2px solid var(--fm-base-300); padding-left: 12px; margin: 14px 0 0; }
    .doc__gap { font-size: var(--doc-caption); line-height: 1.5; color: var(--fm-text-secondary); border-left: 2px solid var(--fm-brand); background: var(--fm-brand-light); padding: 10px 12px; margin: 14px 0 0; }
    .doc__list { margin: 0; padding-left: 20px; }
    .doc__list li { margin: 0 0 10px; }
    .doc__source { color: var(--fm-text-tertiary); font-size: var(--doc-caption); }

    .approaches { display: flex; flex-wrap: wrap; gap: 32px 24px; align-items: flex-start; }
    .proposal-screen__col { display: flex; flex-direction: column; }
    /* Two rows by construction, so every approach label is the same height and the drawings
       share a top edge. One row that wrapped used to push its drawing down by a line. */
    .proposal-screen__label { display: flex; flex-direction: column; gap: 4px; max-width: 100%; font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fm-text-secondary); margin-bottom: 10px; }
    .proposal-screen__name { display: flex; align-items: center; gap: 8px; }
    .proposal-screen__anchor { font-weight: 400; color: var(--fm-text-tertiary); }
    .proposal-screen__num { width: 20px; height: 20px; border-radius: 4px; background: var(--fm-base-800); color: var(--fm-base-white); display: inline-flex; align-items: center; justify-content: center; font-size: var(--doc-micro); }
    .proposal-screen { background: var(--fm-base-white); border: 1px solid var(--fm-base-400); border-radius: 6px; overflow: visible; }
    .proposal-screen .fm-app-header { width: 100%; }
    .proposal-screen__body { position: relative; padding: 16px; }
    .proposal-screen__body .fm-page-header { padding: 0 0 12px; }
    .approach__lines { font-size: var(--doc-caption); line-height: 1.55; color: var(--fm-text-secondary); margin: 12px 0 0; max-width: 100%; }
    .approach__lines b { color: var(--fm-text-primary); }
    /* The verdict is the card's conclusion, so it carries a fill and reads as one object.
       The negative margin cancels the tag's own left padding, which otherwise indents it
       against the two lines above it by exactly the amount that looks like a mistake. */
    .approach__verdict { margin: 12px 0 0 -10px; }
    .approach__verdict .fm-tag { background: var(--fm-base-200); color: var(--fm-base-800); }

    .compare { width: 100%; border-collapse: collapse; font-size: var(--doc-caption); }
    .compare th, .compare td { text-align: left; vertical-align: top; padding: 10px 12px 10px 0; border-top: 1px solid var(--fm-base-300); }
    .compare tbody th { font-weight: 600; padding-right: 24px; }
    .compare thead th { border-top: 0; color: var(--fm-text-tertiary); font-size: var(--doc-micro); text-transform: uppercase; letter-spacing: 0.05em; }
    .compare__source { display: block; font-size: var(--doc-micro); color: var(--fm-text-tertiary); font-weight: 400; margin-top: 2px; }
    /* The picked column, marked where the evidence is read rather than only in the
       paragraph below it. Tint plus a word, so it holds in greyscale and in print. */
    .compare__pick { background: var(--fm-base-100); }
    .compare th.compare__pick, .compare td.compare__pick { padding-left: 12px; }
    .compare thead th.compare__pick { border-top: 2px solid var(--fm-base-800); color: var(--fm-text-primary); }
    .compare__picked { display: block; font-size: var(--doc-micro); font-weight: 700; letter-spacing: 0.06em; color: var(--fm-brand-dark); margin-top: 2px; }
    /* A verdict carries a glyph as well as a colour: WCAG 1.4.1, and the table
       stays readable in greyscale and in print. CSS escapes, not literal glyphs,
       so the file is safe whatever charset a reader's tooling assumes. */
    .compare td::before { font-weight: 700; margin-right: 6px; }
    .tone-good { color: var(--fm-text-success); }
    .tone-good::before { content: "\2713"; }
    .tone-mixed { color: var(--fm-text-secondary); }
    .tone-mixed::before { content: "\25CB"; }
    .tone-bad { color: var(--fm-text-error); }
    .tone-bad::before { content: "\2717"; }

    .oq__kind { display: block; font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin-bottom: 2px; }

    .doc__footer { font-size: var(--doc-caption); color: var(--fm-text-tertiary); margin: 32px 0 0; padding-top: 20px; border-top: 1px solid var(--fm-base-300); max-width: var(--doc-measure); }

    /* The feature's framing question, above the answer, and only in a document that holds
       more than one decision: with one decision it is the decision's own heading. Caption
       scale, because it is the setup and the answer is the statement. */
    .doc__question { font-size: var(--doc-caption); line-height: 1.5; color: var(--fm-text-tertiary); margin: 0 0 10px; max-width: var(--doc-measure); }

    /* The answer. One sentence at h2 scale is the document's first element, tied with a
       decision question rather than with the title above it, and nothing follows it inside
       its own section: "What we decided" is the summary and this is the statement. */
    .answer { font-size: var(--doc-h2); font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; margin: 0; max-width: var(--doc-measure); }

    /* The terrain. The SVG carries no colour of its own; every value it draws with is here. */
    .bb { width: 100%; overflow-x: auto; margin: 0 0 14px; }
    .bb__svg { display: block; max-width: 100%; height: auto; }
    .bb__box { stroke: var(--fm-base-400); stroke-width: 1; }
    .bb__box--new { stroke: var(--fm-brand); stroke-width: 2; stroke-dasharray: 6 4; }
    .bb__app { font-size: var(--doc-micro); font-weight: 700; letter-spacing: 0.08em; fill: var(--fm-text-tertiary); }
    .bb__name { font-size: 15px; font-weight: 700; fill: var(--fm-text-primary); }
    .bb__rule { stroke: var(--fm-base-300); stroke-width: 1; }
    .bb__aff { font-size: var(--doc-caption); fill: var(--fm-text-secondary); }
    .bb__line { stroke: var(--fm-base-600); stroke-width: 2; }
    .bb__line--new { stroke: var(--fm-brand); stroke-dasharray: 6 4; }
    .bb__label { font-size: var(--doc-micro); font-weight: 700; letter-spacing: 0.06em; fill: var(--fm-text-tertiary); }
    .bb__head path { fill: var(--fm-base-600); }
    .bb__head--new path { fill: var(--fm-brand); }
    .bb__legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 0; font-size: var(--doc-micro); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); font-weight: 700; }
    .bb__legend span { display: inline-flex; align-items: center; gap: 6px; }
    .bb__swatch { width: 22px; border-top: 2px solid var(--fm-base-600); }
    .bb__swatch--new { border-top: 2px dashed var(--fm-brand); }

    /* The decision table: what was decided, at a glance, before any of it is argued. */
    .decisions-at-a-glance { width: 100%; border-collapse: collapse; font-size: var(--doc-caption); }
    .decisions-at-a-glance th, .decisions-at-a-glance td { text-align: left; vertical-align: top; padding: 10px 24px 10px 0; border-top: 1px solid var(--fm-base-300); }
    .decisions-at-a-glance thead th { border-top: 0; color: var(--fm-text-tertiary); font-size: var(--doc-micro); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .decisions-at-a-glance tbody th { font-weight: 600; color: var(--fm-text-primary); }
    .decisions-at-a-glance td { color: var(--fm-text-secondary); }

    /* The briefing: four short columns in two pairs, never running prose. The pairing is
       the point. Goals and Not doing are the scope; how it works today and what comparable
       products do are the evidence. Four columns across 1200px made each one 260px of
       ragged 13px text and put a goal beside a research finding as though they answered the
       same question. Two columns, each capped at the measure, wrap into 2x2 on a wide
       canvas and stack to one on a narrow one. */
    .briefing { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), var(--doc-measure))); gap: 28px 40px; }
    .briefing__col h3 { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 10px; }
    .briefing__col .doc__list li { font-size: var(--doc-caption); line-height: 1.55; color: var(--fm-text-secondary); }

    /* A decision block. The question is the heading; the number tells a reader where
       they are in a document that may hold four of these. The rule is heavier and darker
       than a framing section's, because these blocks are the argument and the sections
       around them are the setting. */
    .decision { border-top: 3px solid var(--fm-base-800); padding: 24px 0 0; margin: 0 0 64px; }
    .decision__kicker { display: block; font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 6px; }
    .decision > h2 { font-size: var(--doc-h2); font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 18px; max-width: var(--doc-measure); }
    .decision__blocker { font-size: var(--doc-caption); line-height: 1.5; color: var(--fm-text-secondary); border-left: 2px solid var(--fm-brand); background: var(--fm-brand-light); padding: 10px 12px; margin: 18px 0 0; max-width: var(--doc-measure); }
    .decision__blocker b { color: var(--fm-text-primary); }

    /* Annotations on a drawing: phrases, never sentences. */
    .option__notes { margin: 10px 0 0; padding: 0; list-style: none; }
    .option__notes li { font-size: var(--doc-micro); line-height: 1.5; color: var(--fm-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }

    /* The pick. One line per reason, each naming the row it argues from, then the cost. */
    .pick { margin: 22px 0 0; border-top: 1px solid var(--fm-base-400); padding: 16px 0 0; max-width: var(--doc-measure); }
    .pick__lead { font-size: var(--doc-body); font-weight: 600; margin: 0 0 12px; }
    .pick__lead .decision__kicker { color: var(--fm-brand-dark); }
    .pick__reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .pick__reasons li { font-size: var(--doc-caption); line-height: 1.55; color: var(--fm-text-secondary); }
    .pick__crit { font-weight: 700; color: var(--fm-text-primary); }
    .pick__cost { font-size: var(--doc-caption); line-height: 1.55; color: var(--fm-text-secondary); margin: 14px 0 0; }
    .pick__cost b { color: var(--fm-text-primary); }

    /* What this changes, and the latitude line that closes the document. */
    .change { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), var(--doc-measure))); gap: 28px 40px; }
    .change__col h3 { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fm-text-tertiary); margin: 0 0 8px; }
    .change__col p { font-size: var(--doc-caption); line-height: 1.55; color: var(--fm-text-secondary); margin: 0; }
    .doc__latitude { font-size: var(--doc-caption); line-height: 1.55; color: var(--fm-text-tertiary); margin: 0; max-width: var(--doc-measure); font-style: italic; }

    /* Where this came from. A two-column grid rather than a list, so the kinds stack into
       one narrow column and the eye reads down the texts beside them. The kind column is
       sized to its content and capped, so one long kind cannot push every citation right. */
    .citations { display: grid; grid-template-columns: minmax(0, max-content) 1fr; gap: 6px 20px; max-width: var(--doc-measure); }
    .citations__row { display: contents; }
    .citations__kind { font-size: var(--doc-micro); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fm-text-tertiary); line-height: 1.7; white-space: nowrap; }
    .citations__text { font-size: var(--doc-caption); line-height: 1.5; color: var(--fm-text-secondary); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="doc">
    <header class="doc__head">
      <h1 class="doc__title">{{TITLE}}</h1>
      <p class="doc__context">{{CONTEXT}}</p>
    </header>
<!-- {{SECTIONS}} -->
  </main>
  <script>
    // One delegated listener: any element with data-toggle="<id>" toggles the hidden attribute of #<id>.
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-toggle]");
      if (!t) return;
      var el = document.getElementById(t.getAttribute("data-toggle"));
      if (el) el.hidden = !el.hidden;
    });
  </script>
</body>
</html>
