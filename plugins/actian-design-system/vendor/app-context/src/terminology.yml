_schema_version: 1
# notUse lists words the product never says for anything: every product-facing
# string (app records, entities, recipes, rendered fragments) is checked against
# it as whole words by tests/terminology-enforced.test.js. A word the product
# does use for something else (Dataset is an item type; "Access request policy"
# and "Source description" are captured labels) cannot be listed here; the
# confusion it names is written into `meaning` instead (#710).
terms:
  data-intelligence-platform:
    use: Data Intelligence Platform
    meaning: The overall product
    notUse:
      - the tool
      - the app
  studio:
    use: Studio
    meaning: Governance/catalog app
    notUse:
      - admin panel
      - backend
  explorer:
    use: Explorer
    meaning: Consumer/marketplace app
    notUse:
      - frontend
      - user portal
  administration:
    use: Administration
    meaning: Config/settings app
    notUse:
      - admin app
  catalog-object:
    use: Item
    meaning: Any indexed data asset in a catalog (dataset, field, visualization, data process, data product, glossary item, and custom item types)
    notUse:
      - record
      - entry
      - catalog object
  data-product:
    use: Data product
    meaning: Curated asset shared to the marketplace. Not a dataset, which is its own item type
    notUse: []
  data-contract:
    use: Data contract
    meaning: Quality/access agreement. Not a policy, which the product uses for access request and governance policies
    notUse:
      - SLA
  governance-by-design:
    use: Governance-by-design
    meaning: Policies embedded at creation
    notUse:
      - governance overlay
  contract-first:
    use: Contract-first
    meaning: Define expectations before building
    notUse:
      - quality-first
  shift-left:
    use: Shift-left
    meaning: Catch issues at source
    notUse:
      - early detection
  field-level-lineage:
    use: Field-level lineage
    meaning: Column-level transformation tracking
    notUse:
      - table lineage
  impact-analysis:
    use: Impact analysis
    meaning: Understanding downstream effects of changes
    notUse:
      - dependency check
  federated-knowledge-graph:
    use: Federated knowledge graph
    meaning: Enterprise metadata architecture
    notUse:
      - metadata store
  topic:
    use: Topic
    meaning: Curated, filtered collection of catalog items for Explorer. Not a category, which the product uses for glossary item types
    notUse:
      - folder
  connection:
    use: Connection
    meaning: Configured data source connector. Not an integration
    notUse: []
  completion-level:
    use: Completion level
    meaning: Percentage of metadata filled for an item. Not progress
    notUse:
      - completeness
      - documentation completion
  suggestion:
    use: Suggestion
    meaning: AI-generated metadata enrichment proposal
    notUse:
      - recommendation
  last-updated:
    use: Last updated
    meaning: When an item last changed, as a search result shows it
    notUse:
      - last modified
  curator:
    use: Curator
    meaning: Person responsible for curating a catalog item. Not an owner, which the product uses for the Data Owner responsibility role
    notUse: []
  output-port:
    use: Output port
    meaning: Shared endpoint/view of a data product. Not an API or an export, which the product uses for API keys and for exporting a selection
    notUse: []
  view-360:
    use: View 360
    meaning: Radial knowledge graph centered on an asset
    notUse:
      - relationship view
  watchlist:
    use: Watchlist
    meaning: Saved filter shortcut on Studio Dashboard
    notUse:
      - saved search
  perimeter:
    use: Perimeter
    meaning: Extent of a curator's item responsibility. Not a scope, which the product uses for an API key's permissions
    notUse: []
  scanner:
    use: Scanner
    meaning: External data ingestion agent
    notUse:
      - crawler
      - harvester
  metamodel:
    use: Metamodel
    meaning: System structure/template configuration. Not a schema or a model, which the product uses for a data contract's schema and the data model
    notUse: []
  pii:
    use: PII
    meaning: Personally Identifiable Information flag on fields
    notUse:
      - sensitive data
  ask-ai:
    use: Ask AI
    meaning: Natural language query feature in Explorer
    notUse:
      - AI search
      - chatbot
  ai-ready:
    use: AI Ready
    meaning: Auto-tag on Topics with well-documented items
    notUse:
      - indexed
      - searchable
  data-profiling:
    use: Data Profiling
    meaning: Statistical profile of field values
    notUse:
      - data analysis
  data-sampling:
    use: Data Sampling
    meaning: Sample data rows from a dataset
    notUse:
      - data preview
  input-port:
    use: Input Port
    meaning: Interface for receiving upstream data into a data product. Not an input or a source, which the product uses for form inputs and a source's description
    notUse: []
  federated-catalog:
    use: Federated Catalog
    meaning: Multi-catalog architecture with scoped permissions
    notUse:
      - multi-tenant
  discussion-thread:
    use: Discussion Thread
    meaning: Conversation on a Dataset detail page
    notUse:
      - comment
      - note
  access-request-policy:
    use: Access Request Policy
    meaning: Rules governing the approval workflow for data access
    notUse:
      - access control
